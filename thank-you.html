<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - QL City LAN Series</title>
    <meta name="description" content="Your QL City LAN Series registration has been received.">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500&display=swap&subset=latin" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .card {
            max-width: 560px;
            width: 100%;
            text-align: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            padding: 3rem 2rem;
        }

        .card .tick {
            font-size: 2.5rem;
            line-height: 1;
            margin-bottom: 1.5rem;
        }

        .card h1 {
            font-size: 1.75rem;
            letter-spacing: 2px;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .card p:last-of-type {
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            color: var(--text-faint);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.15s;
        }

        footer a:hover {
            color: var(--accent-bright);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .card {
                padding: 2rem 1.5rem;
            }

            .card h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <div class="tick">✅</div>
            <h1>Thanks &ndash; we got your submission</h1>
            <p>Your registration is in. We will email you with the details and payment information.</p>
            <p>Dates, venue and everything else get announced on our Discord first.</p>
            <div class="actions">
                <a href="https://discord.gg/u8Ttp8frqU" class="btn-primary" target="_blank" rel="noopener">Join Discord</a>
                <a href="/" class="btn-secondary">Back to the site</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 QL City LAN Series</p>
        <p style="margin-top: 1rem;">
            <a href="index.html">Home</a>
            <a href="results.html">Results</a>
            <a href="privacy.html">Privacy</a>
            <a href="https://discord.gg/u8Ttp8frqU" target="_blank" rel="noopener">Discord</a>
        </p>
    </footer>
</body>
</html>
